# --- TriQ (三元Q值) specific parameters ---
action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 100000 # 500000 for 6h_vs_8z

runner: "parallel"
batch_size_run: 8 # batch_size_run=4, buffer_size = 2500, batch_size=64  for 3s5z_vs_3s6z
buffer_size: 5000
batch_size: 128
optimizer: 'adam'

debug_attention: True
t_max: 4000000

# update the target network every {} episodes
target_update_interval: 200

# use the TriQ_Learner to train
mac: "triq_mac"
agent: "triq_rnn"
agent_output_type: q
rnn_hidden_dim: 256

learner: "triq_learner"
mixer: "qmix"
mixing_embed_dim: 32
hypernet_embed: 64
lr: 0.001 # Learning rate for agents
sep_lr: 0.001
rnd_lr: 0.001 # Learning rate for RND
td_lambda: 0.6
optimizer: 'adam'
q_lambda: False
gamma: 0.99

# rnn layer normalization
use_layer_norm: False

# orthogonal init for DNN
use_orthogonal: False
gain: 0.01

# Priority experience replay
use_per: False
per_alpha: 0.6
per_beta: 0.4
return_priority: False

# --- TriQ specific parameters ---

# 智能体类型嵌入维度
agent_type_embed_dim: 16

# 注意力机制参数
attention_dim: 32
attention_heads: 2
use_simple_attention: False  # 使用标准多头注意力

# 局部协调参数
surrounding_radius: 6.0  # 局部邻域半径（MMM/MMM2推荐 6）
max_surrounding_agents: 6  # 最大邻域智能体数（与半径匹配）

# CTDE合规：注意力改为可见性/距离掩码，不再依赖全局坐标
extract_agent_positions: False  # 关闭位置提取路径
extract_agent_types: True  # 保留类型信息（用于动态权重等）

# RND更新频率
rnd_update_interval: 2

# 动态权重参数

# 新颖度参数
max_extra_training: 3

name: "triq_sep_16_lr0.0005"
