# --- QMIX specific parameters ---

# use epsilon greedy action selector
action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.01
epsilon_anneal_time: 500000 # 500000 for 6h_vs_8z

runner: "parallel"
batch_size_run: 16 # batch_size_run=4, buffer_size = 2500, batch_size=64  for 3s5z_vs_3s6z
buffer_size: 10000
batch_size: 256
optimizer: 'adam'


t_max: 4000000

# update the target network every {} episodes
target_update_interval: 200

# RND更新频率
rnd_update_interval: 2

# use the Q_Learner to train
mac: "sep_mac"
agent: "sep_rnn"
agent_output_type: q
rnn_hidden_dim: 256

learner: "sepq_learner"
mixer: "qmix"
mixing_embed_dim: 32
hypernet_embed: 64
lr: 0.001 # Learning rate for agents
sep_lr: 0.001
rnd_lr: 0.001 #Learning rate for RND
td_lambda: 0.6 # 0.3 for 6h_vs_8z
optimizer: 'adam'
q_lambda: False
gamma: 0.99

# rnn layer normalization
use_layer_norm: False

# orthogonal init for DNN
use_orthogonal: False
gain: 0.01

# Priority experience replay
use_per: False
per_alpha: 0.6
per_beta: 0.4
return_priority: False

name: "per_run_16_lr0.0005"
