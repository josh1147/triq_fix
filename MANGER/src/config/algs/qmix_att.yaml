# --- QMIX specific parameters ---

# use epsilon greedy action selector（与 triq_sep_standard 对齐）
action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.01
epsilon_anneal_time: 500000 # 与 TriQ 配置保持一致

runner: "parallel"
batch_size_run: 16
buffer_size: 10000
batch_size: 256
optimizer: 'adam'

t_max: 10000000

# update the target network every {} episodes
target_update_interval: 200

# use the Q_Learner to train
mac: "n_mac"
agent: "att_rnn" # self-attention for communication
agent_output_type: q
att_heads: 4
att_embed_dim: 32

learner: "nq_learner"
mixer: "qmix"
mixing_embed_dim: 32
hypernet_embed: 64
lr: 0.001 # Learning rate for agents
td_lambda: 0.6
optimizer: 'adam'

grad_norm_clip: 20.0

name: "qmix_att_env=8_adam_td_lambda"